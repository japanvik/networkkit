[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "networkkit"
version = "0.0.3"
description = "A simple communication framework for agents using pubsub and http"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<4.0"
authors = [
  { name = "Vikram Kumar", email = "vik@japanvik.net" }
]
keywords = ["network agents", "pubsub", "framework", "communication"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]
dependencies = [
  "aiohttp",
  "pyzmq",
  "fastapi",
  "uvicorn",
  "pydantic",
  "requests",
  "mcp"
]

[project.urls]
Homepage = "https://github.com/japanvik/networkkit"

[project.scripts]
networkkit-mcp-send-message = "networkkit.mcp.send_message_server:main"

[tool.setuptools.packages.find]
include = ["networkkit*"]

[dependency-groups]
dev = [
  "pytest>=8.0.0,<9"
]
